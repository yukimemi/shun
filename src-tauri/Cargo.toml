[package]
name = "shun"
version = "5.5.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
log = "0.4"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
toml_edit = "0.25"
dirs-next = "2"
nucleo-matcher = "0.3"
tera = { version = "1", default-features = false, features = ["builtins"] }
rustmigemo = { git = "https://github.com/yukimemi/rustmigemo", rev = "36a17c4f3e945fdfd7ffc421468f4f90bc50251e" }
regex = "1"
parking_lot = "0.12"


[target.'cfg(windows)'.dependencies]
# Must stay in sync with Tauri's transitive webview2-com/windows-core versions
webview2-com = "0.39"
windows-core = "0.62"
# Used by app_window.rs to activate/toggle app windows (EnumWindows, SetForegroundWindow, ...)
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Used by app_window.rs to activate/toggle app windows natively (NSWorkspace,
# NSRunningApplication) instead of shelling out to osascript/AppleScript.
# Version pinned to whatever tauri/wry already resolve transitively so this
# doesn't pull in a second copy of the objc2 runtime.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSRunningApplication",
    "NSWorkspace",
    "libc",
] }
# Used to marshal isActive/isHidden reads onto the main thread (documented by
# Apple as stale/race-prone off it — see app_window.rs::macos_impl's doc comment).
dispatch2 = "0.3"
# Used to enumerate/raise/minimize individual windows of another app via the
# Accessibility API (AXUIElement) when `[[apps]].window_title` narrows a
# `window_app` match to a specific window — NSRunningApplication/NSWorkspace
# only operate at the whole-app level, not per-window. Only exercised when an
# entry sets `window_title`; entries without it never touch this API.
# NSString/CFString are toll-free bridged, so we build AX attribute-name
# strings via objc2-foundation's NSString rather than hand-rolling
# CFStringCreate calls against core-foundation-sys 0.8's older API.
accessibility-sys = "0.2"
core-foundation-sys = "0.8"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
zip = "8"
tokio = { version = "1", features = ["process", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"

